<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GIRLS LIFE LOG D1906</title>
    <style>
        body { margin: 0; padding: 0; background-color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
        #game-container { position: relative; width: 100vw; max-width: 450px; aspect-ratio: 9 / 14; background-color: #FFFFF0; overflow: hidden; box-shadow: 0 0 15px rgba(0, 0, 0, 0.5); }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; box-sizing: border-box; }
        .active { display: flex; }
        
        #screen1 { justify-content: center; align-items: center; background-color: #FFFFF0; }
        h1 { font-size: 1.8rem; color: #333; text-align: center; margin-bottom: 30px; }
        
        /* 성향 선택 버튼 스타일 */
        .disp-box { text-align: center; margin-bottom: 40px; }
        .disp-title { font-weight: bold; color: #5F8575; margin-bottom: 10px; }
        .disp-btn { background-color: #eee; border: 2px solid #ccc; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 0 5px; transition: 0.2s; }
        .disp-btn.selected { background-color: #5F8575; color: white; border-color: #333; }

        #start-btn { background-color: #808080; color: white; border: none; padding: 15px 40px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; font-weight: bold; display: none; margin: 0 auto; }
        
        #screen2 { background-color: #FFFFF0; padding: 15px; gap: 15px; }
        #top-box { flex: 3; background-color: #5F8575; border-radius: 16px; position: relative; display: flex; justify-content: center; align-items: center; }
        #bottom-box { flex: 7; background-color: #F5F5DC; border-radius: 16px; padding: 20px; box-sizing: border-box; overflow-y: auto; touch-action: pan-y; cursor: pointer; }
        
        #gear-btn { position: absolute; top: 15px; right: 15px; font-size: 20px; background-color: #FFFFF0; border: 2px solid #333; border-radius: 8px; cursor: pointer; width: 38px; height: 38px; display: flex; justify-content: center; align-items: center; padding: 0; }
        #anim-img { width: 64px; height: 64px; object-fit: contain; image-rendering: pixelated; }
        
        .log-item { font-size: 0.95rem; color: #444; margin-bottom: 12px; line-height: 1.4; border-bottom: 1px dashed rgba(0,0,0,0.1); padding-bottom: 8px; }
        .log-time { font-weight: bold; color: #5F8575; border-bottom: none; margin-top: 15px; }
        .log-status { font-size: 0.85rem; background-color: #E8F0EA; color: #333; padding: 12px; border-radius: 8px; margin: 15px 0; white-space: pre-wrap; border-left: 4px solid #5F8575; line-height: 1.5; }
        
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.6); z-index: 10; display: none; justify-content: center; align-items: center; }
        #overlay.active { display: flex; }
        .overlay-content { background-color: #fff; padding: 30px; border-radius: 12px; text-align: center; }
        #home-btn { background-color: #e74c3c; color: white; border: none; padding: 12px 25px; font-size: 1.1rem; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="screen1" class="screen active">
            <h1>GIRLS LIFE LOG<br>D1906</h1>
            
            <div class="disp-box">
                <div class="disp-title">지혜의 초기 성향 선택</div>
                <button class="disp-btn" data-type="고상함">고상함</button>
                <button class="disp-btn" data-type="활달함">활달함</button>
                <button class="disp-btn" data-type="퇴폐적">퇴폐적</button>
            </div>

            <button id="start-btn">게임 시작</button>
        </div>
        <div id="screen2" class="screen">
            <div id="top-box">
                <button id="gear-btn">⚙️</button>
                <img id="anim-img" alt="character animation">
            </div>
            <div id="bottom-box"></div>
        </div>
        <div id="overlay">
            <div class="overlay-content">
                <p style="margin-top:0;">시스템 메뉴</p>
                <button id="home-btn">처음으로</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 달력 시스템 (GameCalendar)
        // ==========================================
        class GameCalendar {
            constructor() {
                this.DAYS_IN_MONTH = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
                this.currentDayIndex = 1; this.hour = 8; this.minute = 0; this.events = {}; 
                for (let y = 1; y <= 3; y++) this.generateYearlyEvents(y);
            }
            getDayIndex(year, month, day) { let days = (year - 1) * 365; for (let i = 1; i < month; i++) days += this.DAYS_IN_MONTH[i]; return Math.min(days + day, 365 * 3); }
            getDateFromIndex(index) { let y = Math.floor((index - 1) / 365) + 1, r = (index - 1) % 365 + 1, m = 1; while (r > this.DAYS_IN_MONTH[m]) { r -= this.DAYS_IN_MONTH[m]; m++; } return { year: y, month: m, day: r }; }
            getDOW(index) { return index % 7; }
            getDOWString(index) { return ["일", "월", "화", "수", "목", "금", "토"][this.getDOW(index)]; }
            getSeasonAndSunTimes(month) {
                if (month >= 3 && month <= 5) return { season: "봄", sunrise: {h: 6, m: 0}, sunset: {h: 20, m: 0} }; 
                if (month >= 6 && month <= 8) return { season: "여름", sunrise: {h: 4, m: 30}, sunset: {h: 21, m: 0} }; 
                if (month >= 9 && month <= 10) return { season: "가을", sunrise: {h: 6, m: 0}, sunset: {h: 19, m: 30} }; 
                return { season: "겨울", sunrise: {h: 7, m: 30}, sunset: {h: 18, m: 0} }; 
            }
            getTimeZone(month, hour, minute) {
                const { sunrise, sunset } = this.getSeasonAndSunTimes(month);
                const nowMins = hour * 60 + minute;
                if (nowMins >= sunrise.h * 60 + sunrise.m && nowMins < 12 * 60) return "오전";
                if (nowMins >= 12 * 60 && nowMins < sunset.h * 60 + sunset.m) return "오후";
                return "밤";
            }
            addEvent(index, eventName) { if (!this.events[index]) this.events[index] = []; this.events[index].push(eventName); }
            getAdjustedFixedDate(y, m, d) { let idx = this.getDayIndex(y, m, d), dow = this.getDOW(idx); return dow === 6 ? idx + 2 : dow === 0 ? idx + 1 : idx; }
            getNthWeekday(y, m, n, targetDow) { let startIdx = this.getDayIndex(y, m, 1), offset = (targetDow - this.getDOW(startIdx) + 7) % 7; return startIdx + offset + (n - 1) * 7; }
            getLastWeekday(y, m, targetDow) { let endIdx = this.getDayIndex(y, m, this.DAYS_IN_MONTH[m]), offset = (this.getDOW(endIdx) - targetDow + 7) % 7; return endIdx - offset; }
            generateYearlyEvents(y) {
                this.addEvent(this.getAdjustedFixedDate(y, 3, 2), y === 1 ? "신입학" : "개학");
                for(let i=0; i<5; i++) this.addEvent(this.getLastWeekday(y, 4, 1) + i, "중간고사");
                this.addEvent(this.getNthWeekday(y, 5, 3, 3), "운동회");
                for(let i=0; i<5; i++) this.addEvent(this.getLastWeekday(y, 6, 1) + i, "기말고사");
                this.addEvent(this.getNthWeekday(y, 7, 2, 5), "여름방학 시작");
                this.addEvent(this.getAdjustedFixedDate(y, 9, 1), "개학");
                this.addEvent(this.getAdjustedFixedDate(y, 9, 2), "개교기념일");
                this.addEvent(this.getAdjustedFixedDate(y, 10, 8), "교내 글짓기 대회");
                for(let i=0; i<5; i++) this.addEvent(this.getNthWeekday(y, 10, 2, 1) + i, "중간고사");
                this.addEvent(this.getLastWeekday(y, 10, 3), "학교 축제");
                for(let i=0; i<5; i++) this.addEvent(this.getNthWeekday(y, 11, 2, 1) + i, "기말고사");
                this.addEvent(this.getNthWeekday(y, 12, 2, 5), "겨울방학 시작");
                [{m:2,d:14,n:"발렌타인데이"},{m:3,d:14,n:"화이트데이"},{m:11,d:11,n:"빼빼로데이"},{m:12,d:25,n:"크리스마스"},{m:5,d:5,n:"지혜생일"},{m:10,d:17,n:"사유생일"},{m:2,d:28,n:"기택생일"}].forEach(a => this.addEvent(this.getDayIndex(y, a.m, a.d), a.n));
            }
            getCurrentState() {
                const { year, month, day } = this.getDateFromIndex(this.currentDayIndex);
                return { 
                    year, month, day, dow: this.getDOWString(this.currentDayIndex), 
                    ...this.getSeasonAndSunTimes(month), 
                    timeZone: this.getTimeZone(month, this.hour, this.minute), 
                    hour: this.hour, minute: this.minute,
                    timeStr: `${this.hour.toString().padStart(2, '0')}:${this.minute.toString().padStart(2, '0')}`, 
                    events: this.events[this.currentDayIndex] || [] 
                };
            }
            addMinutes(mins) {
                this.minute += mins;
                while (this.minute >= 60) { this.minute -= 60; this.hour++; }
                while (this.hour >= 24) { this.hour -= 24; if (this.currentDayIndex < 365 * 3) this.currentDayIndex++; }
            }
        }

        // ==========================================
        // 2. 장소 관리 (PlaceManager)
        // ==========================================
        class PlaceManager {

                    "다빈의 집": { area: "A", name: "다빈의 집", ownerId: "dabin", isReachable: true, items: [{ name: "침대", tags: ["수면"] }, { name: "변기", tags: ["용변"] }, { name: "밥", tags: ["음식", "무한"] }] },

                    "운동장": { area: "A", name: "학교 운동장", isReachable: true, items: [{ name: "모래", tags: [] }, { name: "송곳", tags: ["위협"], isHidden: true }] },

                    "남자화장실": { area: "A", name: "학교 남자화장실", isReachable: true, items: [{ name: "변기", tags: ["용변", "남자"] }] },
                    "여자화장실": { area: "A", name: "학교 여자화장실", isReachable: true, items: [{ name: "변기", tags: ["용변", "여자"] }] },
                    "지혜의 집": { area: "B", name: "지혜의 집", ownerId: "jihye", isReachable: true, items: [{ name: "침대", tags: ["수면"] }, { name: "텅 빈 어항", tags: [] }, { name: "가위", tags: ["위협"] }, { name: "유통기한 지난 향수", tags: ["치장"] }, { name: "변기", tags: ["용변"] }, { name: "밥", tags: ["음식", "무한"] }] },
                    "사유의 집": { area: "B", name: "사유의 집", ownerId: "sayu", isReachable: true, items: [{ name: "사유의 일기장", tags: ["학용품"] }, { name: "침대", tags: ["수면"] }, { name: "변기", tags: ["용변"] }, { name: "밥", tags: ["음식", "무한"] }] },
                    "기택의 집": { area: "B", name: "기택의 집", ownerId: "gitaek", isReachable: true, items: [{ name: "침대", tags: ["수면"] }, { name: "변기", tags: ["용변"] }, { name: "밥", tags: ["음식", "무한"] }] },
                    "편의점B": { area: "B", name: "편의점B", isReachable: true, items: [{ name: "햄버거", tags: ["음식"] }, { name: "삼각김밥", tags: ["음식"] }, { name: "콜라", tags: ["음료"] }, { name: "캔맥주", tags: ["음료", "일탈"] }] },
                    "뒷산": { area: "B", name: "뒷산", isReachable: true, items: [{ name: "고라니", tags: ["위협"] }, { name: "쥐덫", tags: ["위협"] }] },
                    "공터": { area: "B", name: "공터", isReachable: true, items: [{ name: "파이프", tags: ["위협"] }, { name: "축구공", tags: [] }] },
                    "미나의 집": { area: "C", name: "미나의 집", ownerId: "mina", isReachable: true, items: [{ name: "침대", tags: ["수면"] }, { name: "변기", tags: ["용변"] }, { name: "밥", tags: ["음식", "무한"] }] },
                    "신우의 집": { area: "C", name: "신우의 집", ownerId: "shinwoo", isReachable: true, items: [{ name: "침대", tags: ["수면"] }, { name: "변기", tags: ["용변"] }, { name: "밥", tags: ["음식", "무한"] }] },
                    "도서관": { area: "C", name: "도서관", isReachable: true, items: [{ name: "죄와 벌", tags: ["어려운 책", "공부"] }, { name: "인간실격", tags: ["기괴한 책"] }] },
                    "지하철역": { area: "C", name: "지하철역", isReachable: true, items: [{ name: "삐라", tags: ["일탈"] }] },
                    "서점": { area: "C", name: "서점", isReachable: true, items: [{ name: "소설", tags: ["학용품"] }] },
                    "레스토랑": { area: "C", name: "레스토랑", isReachable: true, items: [{ name: "스테이크", tags: ["음식"] }] },
                    "유원지": { area: "C", name: "유원지", isReachable: true, items: [{ name: "관람차", tags: ["행복"] }] },
                    "헬스장": { area: "C", name: "헬스장", isReachable: true, items: [{ name: "런닝머신", tags: [] }, { name: "무료 프로틴", tags: ["음료"] }] },
                    "폐건물": { area: "D", name: "폐건물", isReachable: true, items: [{ name: "깨진 유리조각", tags: ["위협"] }, { name: "더러운 봉제인형", tags: ["로맨틱", "기현상"] }] },
                    "편의점D": { area: "D", name: "편의점D", isReachable: true, items: [{ name: "햄버거", tags: ["음식"] }, { name: "콜라", tags: ["음료"] }] },
                    "천체관측소": { area: "D", name: "천체관측소", isReachable: true, items: [{ name: "플라네타리움", tags: ["럭셔리"] }] },
                    "앨리스의 집": { area: "E", name: "앨리스의 집", ownerId: "alice", isReachable: false, items: [{ name: "침대", tags: ["수면"] }, { name: "변기", tags: ["용변"] }, { name: "밥", tags: ["음식", "무한"] }] },
                    "기택의 학원": { area: "E", name: "기택의 학원", ownerId: "gitaek", isReachable: true, items: [{ name: "문제집", tags: ["공부"] }] },
                    "외계인의 집": { area: "E", name: "울툼쿠라피의 집", isReachable: false, items: [{ name: "안티키테라 기계", tags: ["기현상"] }] },

        // ==========================================
        // 3. 캐릭터 시스템 (상태이상, 메모리, 성향, 기택 AI 추가)
        // ==========================================
        class CharacterManager {
            constructor() {
                this.clamp = (val, min, max) => Math.max(min, Math.min(max, val));
                const initStats = (affection = {}, antipathy = {}) => ({
                    _hunger: 0, _stomach: 0, _fatigue: 0, affection: affection, antipathy: antipathy,
                    isSleeping: false, sleepTimer: 0, cooldowns: { glance: 0 }, lastLocation: null,
                    travelTimeLeft: 0, destination: null,
                    // [신규] 상태이상 및 AI 전용 변수
                    statuses: { affectionSat: 0, hatredSat: 0, drunk: 0, shame: 0 },
                    affectionAccCount: 0, memory: [], gitaekState: { doneToday: false, timer: 0 }
                });

                this.jihye = { id: "jihye", name: "하지혜", gender: "F", currentLocation: "지혜의 집", lastLocation: "지혜의 집", _health: 100, _mental: 100, _normalcy: 100, disposition: null, modifiers: {}, ...initStats({ sayu: 20, gitaek: 50, dabin: 5 }, { sayu: 0, gitaek: 5, dabin: 30 }) };
                this.npcs = [
                    { id: "sayu", name: "사유", gender: "F", currentLocation: "편의점B", lastLocation: "편의점B", isActive: () => true, ...initStats({ jihye: 40, gitaek: 10, dabin: 10 }, {}) },
                    { id: "dabin", name: "다빈", gender: "F", currentLocation: "공터", lastLocation: "공터", isActive: () => true, ...initStats({ jihye: 10, sayu: 10, gitaek: 0 }, { jihye: 10, sayu: 10, gitaek: 50 }) },
                    { id: "mina", name: "미나", gender: "F", currentLocation: "헬스장", lastLocation: "헬스장", isActive: (j) => j._health <= 40, ...initStats({ jihye: 50 }, {}) },
                    { id: "alice", name: "앨리스", gender: "F", currentLocation: "천체관측소", lastLocation: "천체관측소", isActive: (j) => j._normalcy <= 50, ...initStats({ jihye: 60 }, {}) },
                    { id: "gitaek", name: "기택", gender: "M", currentLocation: "지하철역", lastLocation: "지하철역", isActive: () => true, ...initStats({ jihye: 0, sayu: 2, dabin: 40 }, { jihye: 30, sayu: 5, dabin: 0 }) },
                    { id: "yusang", name: "유상", gender: "M", currentLocation: "폐건물", lastLocation: "폐건물", isActive: (j) => j._mental <= 40, ...initStats({ jihye: 30 }, { jihye: 30 }) },
                    { id: "shinwoo", name: "신우", gender: "M", currentLocation: "학교", lastLocation: "학교", isActive: (j, d) => d.year > 2 || (d.year === 2 && d.month >= 3), ...initStats({ jihye: 50, sayu: 20, dabin: 30 }, { gitaek: 40 }) }
                ];
            }

            // [신규] 초기 성향 세팅 함수
            setJihyeDisposition(type) {
                this.jihye.disposition = type;
                if (type === "고상함") {
                    this.jihye.preferredLocation = ["도서관"];
                    this.jihye.modifiers = { drain: "_health", defense: "_normalcy" };
                } else if (type === "활달함") {
                    this.jihye.preferredLocation = ["헬스장"];
                    this.jihye.modifiers = { drain: "_mental", defense: "_health" };
                } else if (type === "퇴폐적") {
                    this.jihye.preferredLocation = ["레스토랑"];
                    this.jihye.modifiers = { drain: "_normalcy", defense: "_mental" };
                }
            }

            getCharacter(id) { return id === "jihye" ? this.jihye : this.npcs.find(n => n.id === id); }
            getActiveNPCs(currentDateState) { return this.npcs.filter(npc => npc.isActive(this.jihye, currentDateState)); }
            
            // [수정] 지혜 스탯 증감 시 방어/소모 보정 적용
            modifyJihyeStat(statName, amount) { 
                if (amount < 0 && this.jihye.modifiers) {
                    if (this.jihye.modifiers.drain === statName) amount *= 2; // 빠른 소모
                    if (this.jihye.modifiers.defense === statName) amount = Math.ceil(amount / 2); // 방어 반감
                }
                this.jihye[statName] = this.clamp(this.jihye[statName] + amount, statName === "_normalcy" ? -100 : -10, 100); 
            }
            modifyVital(charId, statName, amount) { let char = this.getCharacter(charId); if (char) char[statName] = this.clamp(char[statName] + amount, 0, 100); }
            modifyRelationship(fromId, type, toId, amount) { let char = this.getCharacter(fromId); if (char) char[type][toId] = this.clamp((char[type][toId] || 0) + amount, type === "affection" ? -10 : 0, 100); }
            getRelationship(fromId, type, toId) { let char = this.getCharacter(fromId); return char && char[type][toId] ? char[type][toId] : 0; }
        }

        // ==========================================
        // 4. 턴 엔진 (행동 로직 고도화 및 내러티브 로그 개편)
        // ==========================================
        class TurnEngine {
            constructor(calendarSys, characterSys, placeSys) {
                this.calendar = calendarSys;
                this.chars = characterSys;
                this.places = placeSys;
                this.lastJihyeLocation = null;
                this.lastDayIndex = this.calendar.currentDayIndex; 
            }

            getAreaDistance(area1, area2) {
                if (area1 === area2) return 0;
                if (area1 === "Street" || area2 === "Street") return 0;
                const map = { "A": 1, "B": 2, "C": 3, "D": 4, "E": 99 };
                let d1 = map[area1], d2 = map[area2];
                if (d1 === undefined || d2 === undefined) return 0;
                if (area1 === "E" || area2 === "E") return 1;
                return Math.abs(d1 - d2);
            }
            
            findLocationWithTag(tag, char, timeState) {
                let validPlaces = [];
                let currLocName = char.currentLocation;
                let currArea = this.places.locations[currLocName] ? this.places.locations[currLocName].area : "Street";

                for (const [key, loc] of Object.entries(this.places.locations)) {
                    if (!loc.isReachable) continue;

                    if (loc.ownerId) {
                        let ownerObj = this.chars.getCharacter(loc.ownerId);
                        if (loc.ownerId !== "jihye" && ownerObj && ownerObj.isActive && !ownerObj.isActive(this.chars.jihye, timeState)) continue;
                        if (loc.ownerId !== char.id && this.chars.getRelationship(loc.ownerId, 'affection', char.id) < 40) continue;
                    }

                    let hasTag = loc.items.some(item => {
                        if (!item.tags.includes(tag) || item.isHidden) return false;
                        if (tag === "용변") {
                            if (item.tags.includes("남자") && char.gender === "F") return false;
                            if (item.tags.includes("여자") && char.gender === "M") return false;
                        }
                        return true;
                    });

                    if (hasTag) {
                        let cost = (currLocName === key) ? -1 : (this.getAreaDistance(currArea, loc.area) === 0 ? (loc.name.includes(currLocName.split(" ")[0]) ? 0.1 : 0.5) : this.getAreaDistance(currArea, loc.area));
                        validPlaces.push({ key: key, cost: cost });
                    }
                }

                if (validPlaces.length === 0) return tag === "수면" ? "길거리" : "편의점B";
                validPlaces.sort((a, b) => a.cost - b.cost);
                let minCost = validPlaces[0].cost;
                return validPlaces.filter(p => p.cost === minCost)[0].key;
            }

            getFakeTime(hour, minute) {
                let offset = Math.floor(Math.random() * 31) - 15;
                let totalMins = hour * 60 + minute + offset;
                if (totalMins < 0) totalMins += 24 * 60;
                let h = Math.floor(totalMins / 60) % 24;
                let m = totalMins % 60;
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
            }

            getSortedDesires(char, timeState) {
                let desires = [];
                const isWeekday = !["토", "일"].includes(timeState.dow);
                const hour = timeState.hour;
                
                if (char.id === "gitaek" && !char.gitaekState.doneToday) {
                    let inSchoolTime = isWeekday && hour >= 9 && hour < 16;
                    if (!inSchoolTime) desires.push({ name: "학원루틴", score: 100, target: null });
                }

                desires.push({ name: "수업", score: (isWeekday && hour >= 9 && hour < 16) ? 50 : 0, target: null });
                desires.push({ name: "식욕", score: Math.pow(char._hunger / 10, 2), target: null });
                desires.push({ name: "요의", score: Math.pow(char._stomach / 10, 2), target: null });
                desires.push({ name: "수면욕", score: Math.pow(char._fatigue / 10, 2), target: null });
                
                let maxAff = 0, targetLover = null;
                for (const [t, v] of Object.entries(char.affection)) if (v > maxAff) { maxAff = v; targetLover = t; }
                let maxAnti = 0, targetEnemy = null;
                for (const [t, v] of Object.entries(char.antipathy)) if (v > maxAnti) { maxAnti = v; targetEnemy = t; }
                
                if (char.statuses.drunk <= 0) {
                    if (char.statuses.affectionSat > 0) maxAff = 0;
                    if (char.statuses.hatredSat > 0) maxAnti = 0;
                }

                desires.push({ name: "애욕", score: maxAff * 0.4, target: targetLover });
                desires.push({ name: "증오", score: maxAnti * 0.4, target: targetEnemy });
                return desires.sort((a, b) => b.score - a.score);
            }

            pickAction(pool) { return pool[Math.floor(Math.random() * pool.length)]; }

            generateStatusReport(activeChars) {
                let lines = ["📢 [현재 활동 캐릭터 관계도 정보]"]; 
                activeChars.forEach(char => {
                    let affs = [], antis = [];
                    for (const [t, v] of Object.entries(char.affection)) if(v>0) affs.push(this.chars.getCharacter(t).name);
                    for (const [t, v] of Object.entries(char.antipathy)) if(v>0) antis.push(this.chars.getCharacter(t).name);
                    lines.push(`- [${char.name}] 호감: ${affs.length>0 ? affs.join(", ") : "없음"} | 반감: ${antis.length>0 ? antis.join(", ") : "없음"}`);
                });
                return lines.join("\n");
            }

            processOneTick() {
                this.calendar.addMinutes(60);
                const timeState = this.calendar.getCurrentState();
                const fakeTimeStr = this.getFakeTime(timeState.hour, timeState.minute);
                const activeChars = [this.chars.jihye, ...this.chars.getActiveNPCs(timeState)];
                let intents = {};

                if (this.lastDayIndex !== this.calendar.currentDayIndex) {
                    activeChars.forEach(c => { if (c.gitaekState) c.gitaekState.doneToday = false; });
                    this.lastDayIndex = this.calendar.currentDayIndex;
                }

                // 1. 상태이상 틱 처리 및 목적지 탐색
                activeChars.forEach(char => {
                    if (char.statuses.affectionSat > 0) char.statuses.affectionSat--;
                    if (char.statuses.hatredSat > 0) char.statuses.hatredSat--;
                    if (char.statuses.drunk > 0) char.statuses.drunk--;
                    if (char.statuses.shame > 0) char.statuses.shame--;
                    if (char.cooldowns.glance > 0) char.cooldowns.glance--;
                    
                    if (char.isSleeping) {
                        this.chars.modifyVital(char.id, '_fatigue', -8); char.sleepTimer--;
                        let wokeUp = false;
                        if (char.sleepTimer <= 0 || char._fatigue <= 0) { char.isSleeping = false; wokeUp = true; }
                        intents[char.id] = { char, isSleepingTick: true, wokeUp: wokeUp, targetDest: char.currentLocation, sleepType: char.sleepType };
                        return; 
                    }

                    this.chars.modifyVital(char.id, '_hunger', 5);
                    this.chars.modifyVital(char.id, '_fatigue', 5);
                    let sorted = this.getSortedDesires(char, timeState);
                    let primary = sorted[0];
                    if (primary.name === "애욕" && primary.target && this.chars.getRelationship(char.id, 'antipathy', primary.target) >= 31) primary.name = "증오";

                    let targetDest = char.preferredLocation ? char.preferredLocation[0] : "길거리";
                    if (primary.name === "수업") targetDest = "학교";
                    else if (primary.name === "학원루틴") targetDest = char.gitaekState.step === 0 ? "지하철역" : "기택의 학원";
                    else if (primary.name === "식욕") targetDest = this.findLocationWithTag("음식", char, timeState);
                    else if (primary.name === "요의") targetDest = this.findLocationWithTag("용변", char, timeState);
                    else if (primary.name === "수면욕") targetDest = this.findLocationWithTag("수면", char, timeState);

                    if ((primary.name === "애욕" || primary.name === "증오") && primary.target) {
                        let targetChar = this.chars.getCharacter(primary.target);
                        if (targetChar) targetDest = targetChar.destination || targetChar.currentLocation;
                    }

                    if (char.currentLocation !== targetDest && char.travelTimeLeft <= 0) {
                        let currArea = this.places.locations[char.currentLocation] ? this.places.locations[char.currentLocation].area : "Street";
                        let targetArea = this.places.locations[targetDest] ? this.places.locations[targetDest].area : "Street";
                        let dist = this.getAreaDistance(currArea, targetArea);
                        
                        if (dist > 0) {
                            char.destination = targetDest;
                            char.travelTimeLeft = dist;
                            char.currentLocation = "길거리";
                        } else {
                            char.currentLocation = targetDest;
                        }
                    }
                    intents[char.id] = { char, primary, targetDest };
                });

                let jihyeLoc = this.chars.jihye.currentLocation;
                let isLocChanged = (jihyeLoc !== this.lastJihyeLocation);
                this.lastJihyeLocation = jihyeLoc;
                
                let jihyeActionText = "", jihyeWokeUp = false;
                let npcActionTexts = [];

                // --- [신규/수정] 침대 및 화장실 점유율 추적 객체 ---
                let occupiedItems = {}; 
                const isOccupied = (loc, item) => occupiedItems[loc] && occupiedItems[loc].includes(item);
                const setOccupy = (loc, item) => { if(!occupiedItems[loc]) occupiedItems[loc] = []; occupiedItems[loc].push(item); };

                // 전 턴부터 자고 있던 사람들의 침대 점유 등록
                activeChars.forEach(char => {
                    let occ = intents[char.id];
                    if (occ.isSleepingTick && occ.sleepType === "침대" && !occ.wokeUp) {
                        setOccupy(char.currentLocation, "침대_" + char.id); 
                    }
                });

                // 2. 행동 실행 및 내러티브 로그 수집
                activeChars.forEach(char => {
                    let occ = intents[char.id];
                    let locName = char.currentLocation;
                    let isJihyeRoom = (locName === jihyeLoc);
                    let actionResult = "";

                    if (occ.isSleepingTick) {
                        actionResult = `${char.name}은(는) ${char.sleepType}에서 잤다.`;
                        if (char.id === "jihye") jihyeWokeUp = occ.wokeUp;
                    } else if (char.travelTimeLeft > 0) {
                        char.travelTimeLeft--;
                        actionResult = `${char.name}은(는) ${char.destination}로 이동했다.`;
                        if (char.travelTimeLeft <= 0) { char.currentLocation = char.destination; char.destination = null; }
                    } else {
                        let primary = occ.primary;
                        let locObj = this.places.locations[locName];
                        let itemsInRoom = locObj ? locObj.items : [];

                        if (char.id === "sayu" && isJihyeRoom && char.memory.length > 0) {
                            let gossip = char.memory.shift();
                            actionResult = `사유는 다가와 속삭였다. "${gossip}"`;
                        }
                        else if (primary.name === "수면욕") {
                            // 현재 방에 있는 침대 개수와 사용 중인 침대 수 비교
                            let bedCount = itemsInRoom.filter(i => i.tags.includes("수면") && !i.isHidden && i.name.includes("침대")).length;
                            let usedBeds = occupiedItems[locName] ? occupiedItems[locName].filter(tag => tag.includes("침대")).length : 0;
                            
                            if (bedCount > usedBeds) {
                                setOccupy(locName, "침대_" + char.id);
                                char.isSleeping = true; char.sleepTimer = 6; char.sleepType = "침대";
                            } else {
                                char.isSleeping = true; char.sleepTimer = 3; char.sleepType = "노상";
                                if (char.id === "jihye") this.chars.modifyJihyeStat('_normalcy', -3);
                            }
                            actionResult = `${char.name}은(는) ${char.sleepType}에서 잤다.`;
                        }
                        else if (primary.name === "요의") {
                            let toilet = itemsInRoom.find(i => i.tags.includes("용변") && !i.isHidden);
                            if (toilet && !isOccupied(locName, "변기")) {
                                setOccupy(locName, "변기");
                                char._stomach = 0;
                                actionResult = `${char.name}은(는) 변기에서 용변을 봤다.`;
                            } else {
                                if (char._stomach > 80) {
                                    char.statuses.shame = 3;
                                    char._stomach = 0;
                                    actionResult = `${char.name}은(는) 바닥에서 용변을 봤다.`;
                                } else {
                                    actionResult = `${char.name}은(는) ${locName}에서 시간을 보냈다.`;
                                }
                            }
                        }
                        else if (primary.name === "식욕") {
                            let foods = itemsInRoom.filter(i => (i.tags.includes("음식") || i.tags.includes("음료")) && !i.isHidden);
                            if (char.id === "dabin") {
                                let dev = foods.filter(i => i.tags.includes("일탈"));
                                if (dev.length > 0) foods = dev;
                            }
                            if (foods.length > 0) {
                                let picked = foods[Math.floor(Math.random() * foods.length)];
                                char._hunger = 0;
                                if (picked.name === "캔맥주" || picked.name === "병소주") char.statuses.drunk += 2;
                                actionResult = `${char.name}은(는) ${picked.name}을(를) 먹었다.`;
                            } else {
                                actionResult = `${char.name}은(는) ${locName}에서 시간을 보냈다.`;
                            }
                        }
                        // --- [수정] 수면 중인 상대방에 대한 예외 처리 강화 ---
                        else if (primary.name === "애욕" && primary.target) {
                            let targetOcc = intents[primary.target];
                            if (targetOcc && targetOcc.char.currentLocation === locName && targetOcc.char.travelTimeLeft <= 0) {
                                if (targetOcc.isSleepingTick) {
                                    // 타겟이 자고 있을 때
                                    actionResult = `[${targetOcc.char.name}]에게 다가갔으나, 잠들어 있어 바라보기만 했다.`;
                                } else {
                                    let aff = this.chars.getRelationship(char.id, 'affection', primary.target);
                                    let actionName = aff <= 30 ? this.pickAction(["가벼운 눈인사", "곁눈질"]) : aff <= 50 ? this.pickAction(["살가운 인사", "대화 시도"]) : this.pickAction(["고백", "스킨십"]);
                                    
                                    let reactScore = this.chars.getRelationship(primary.target, 'affection', char.id) - this.chars.getRelationship(primary.target, 'antipathy', char.id);
                                    let reactTxt = "무덤덤한";
                                    if (reactScore > 0) {
                                        reactTxt = "기분 좋은";
                                        char.affectionAccCount++;
                                        if(char.affectionAccCount >= 2) { char.statuses.affectionSat = 4; char.affectionAccCount = 0; }
                                    } else if (reactScore < 0) {
                                        reactTxt = "불쾌한";
                                    }
                                    let targetName = targetOcc.char.name;
                                    actionResult = `${char.name}은(는) ${targetName}에게 ${actionName}을(를) 했다.\n   -> ${targetName}은(는) 기분이 ${reactTxt === "기분 좋은" ? "좋아졌다" : (reactTxt === "불쾌한" ? "나빠졌다" : "그대로다")}.`;
                                }
                            } else {
                                actionResult = `${char.name}은(는) ${locName}에서 시간을 보냈다.`;
                            }
                        }
                        else if (primary.name === "증오" && primary.target) {
                            let targetOcc = intents[primary.target];
                            if (targetOcc && targetOcc.char.currentLocation === locName && targetOcc.char.travelTimeLeft <= 0) {
                                if (targetOcc.isSleepingTick) {
                                    // 타겟이 자고 있을 때
                                    actionResult = `잠든 [${targetOcc.char.name}]을(를) 적대적으로 노려보았다.`;
                                } else {
                                    let anti = this.chars.getRelationship(char.id, 'antipathy', primary.target);
                                    let actionName = anti <= 30 ? this.pickAction(["비난", "무시"]) : anti <= 50 ? this.pickAction(["회피", "거절"]) : this.pickAction(["뺨때리기", "침뱉기"]);
                                    
                                    char.statuses.hatredSat = 3;
                                    if (primary.target === "jihye" && this.chars.jihye.statuses.shame > 0) this.chars.modifyJihyeStat('_mental', -5);
                                    
                                    let targetName = targetOcc.char.name;
                                    actionResult = `${char.name}은(는) ${targetName}에게 ${actionName}을(를) 했다.\n   -> ${targetName}은(는) 기분이 나빠졌다.`;
                                }
                            } else {
                                actionResult = `${char.name}은(는) ${locName}에서 시간을 보냈다.`;
                            }
                        }
                        else if (primary.name === "학원루틴") {
                            if (locName === "지하철역") {
                                char.gitaekState.timer++;
                                actionResult = `${char.name}은(는) ${locName}에서 시간을 보냈다.`;
                                if (char.gitaekState.timer >= 1) { char.gitaekState.step = 1; char.gitaekState.timer = 0; }
                            } else if (locName === "기택의 학원") {
                                char.gitaekState.timer++;
                                actionResult = `${char.name}은(는) ${locName}에서 시간을 보냈다.`;
                                if (char.gitaekState.timer >= 3) { char.gitaekState.doneToday = true; char.gitaekState.step = 0; char.gitaekState.timer = 0; }
                            } else {
                                actionResult = `${char.name}은(는) ${locName}에서 시간을 보냈다.`;
                            }
                        }
                        else {
                            actionResult = `${char.name}은(는) ${locName}에서 시간을 보냈다.`;
                        }
                    }

                    if (char.id === "jihye") jihyeActionText = actionResult;
                    else {
                        if (!isLocChanged && !occ.isSleepingTick && char.travelTimeLeft <= 0) {
                            if (char.lastLocation !== jihyeLoc && char.currentLocation === jihyeLoc) npcActionTexts.push(`${char.name}은(는) ${jihyeLoc}로 이동했다.`);
                            else if (char.lastLocation === jihyeLoc && char.currentLocation !== jihyeLoc) npcActionTexts.push(`${char.name}은(는) 다른 곳으로 이동했다.`);
                        }
                        
                        if (isJihyeRoom && actionResult && char.travelTimeLeft <= 0 && !actionResult.includes("에서 시간을 보냈다")) {
                            if (occ.wokeUp) npcActionTexts.push(`☀️ ${char.name}은(는) 잠에서 깼다.`);
                            npcActionTexts.push(actionResult);
                        } else if (!isJihyeRoom && (occ.primary && (occ.primary.name === "애욕" || occ.primary.name === "증오")) && actionResult.includes("에게")) {
                            let sayuObj = this.chars.getCharacter("sayu");
                            if (sayuObj && sayuObj.currentLocation === locName && sayuObj.travelTimeLeft <= 0) {
                                let match = actionResult.match(/은\(는\) (.*?)에게 (.*?)을\(를\) 했다/);
                                if(match) sayuObj.memory.push(`${char.name}이(가) ${match[1]}에게 ${match[2]}을(를) 했다더라.`);
                            }
                        }
                    }
                });

                activeChars.forEach(c => c.lastLocation = c.currentLocation);

                return {
                    fakeTimeStr: fakeTimeStr, timeState: timeState, is9AM: (timeState.timeStr === "09:00"),
                    location: jihyeLoc, isLocChanged: isLocChanged,
                    jihyeAction: jihyeActionText, jihyeWokeUp: jihyeWokeUp,
                    npcActions: npcActionTexts, activeChars: activeChars
                };
            }

            processOneHour() {
                let tick = this.processOneTick();
                let logs = [];

                logs.push({ type: 'time', text: `=== [${tick.timeState.year}년차 ${tick.timeState.month}월 ${tick.timeState.day}일] ${tick.fakeTimeStr} ===` });
                if (tick.is9AM) logs.push({ type: 'status', text: this.generateStatusReport(tick.activeChars) });
                
                if (tick.isLocChanged) {
                    logs.push({ type: 'log', text: `지혜는 ${tick.location}로 이동했다.` });
                }

                if (!tick.jihyeAction.includes("로 이동했다")) logs.push({ type: 'log', text: tick.jihyeAction });
                
                if (tick.jihyeWokeUp) logs.push({ type: 'log', text: `☀️ 지혜는 잠에서 깼다.` });
                tick.npcActions.forEach(nAct => logs.push({ type: 'log', text: nAct }));

                return logs;
            }
        }

        // ==========================================
        // 5. DOM 및 이벤트 바인딩 (성향 선택 포함)
        // ==========================================
        const screen1 = document.getElementById('screen1'); const screen2 = document.getElementById('screen2');
        const overlay = document.getElementById('overlay'); const startBtn = document.getElementById('start-btn');
        const gearBtn = document.getElementById('gear-btn'); const homeBtn = document.getElementById('home-btn');
        const animImg = document.getElementById('anim-img'); const bottomBox = document.getElementById('bottom-box');

        const characterSys = new CharacterManager();
        const gameEngine = new TurnEngine(new GameCalendar(), characterSys, new PlaceManager());

        });

        bottomBox.addEventListener('click', () => {
            const logs = gameEngine.processOneHour();
            logs.forEach(logObj => {
                const logDiv = document.createElement('div');
                if (logObj.type === 'time') logDiv.className = 'log-item log-time';
                else if (logObj.type === 'status') logDiv.className = 'log-status';
                else logDiv.className = 'log-item';
                
                logDiv.innerText = logObj.text;
                bottomBox.appendChild(logDiv);
            });
            bottomBox.scrollTo({ top: bottomBox.scrollHeight, behavior: 'smooth' });
        });
